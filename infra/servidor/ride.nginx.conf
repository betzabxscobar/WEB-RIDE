# La web de Ride servida por nginx
# ---------------------------------------------------------------------------
# Va en /etc/nginx/sites-available/ride y se enlaza desde sites-enabled.
#
# NO toca el sitio `default` que ya hubiera en el servidor: este responde solo a
# los nombres de `server_name`, y nginx da preferencia a una coincidencia exacta
# de nombre sobre el `default_server`. Lo que hubiera antes sigue contestando a
# todo lo demás.
#
# Las cabeceras son las mismas de `public/_headers` —que leen Netlify y
# Cloudflare Pages y nginx no entiende— y `npm run check:quality` compara las
# dos listas para que nadie cambie una y olvide la otra.

server {
    listen 80;
    listen [::]:80;

    # Por IP también: mientras el dominio no resuelva, se entra por
    # http://192.168.0.254 desde la propia red.
    server_name rideviajes.com.ec www.rideviajes.com.ec 192.168.0.254;

    # El repositorio esta clonado en el propio servidor y se compila alli, asi
    # que la raiz es su `dist`. No se sube nada por SFTP: se hace `git pull` y
    # `npm run build` en el servidor. Ver README.md.
    root /var/www/WEB-RIDE/dist;
    index index.html;

    # `always` para que las cabeceras salgan también en los errores. Sin eso,
    # un 404 se sirve sin política de seguridad.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://*.supabase.co https://router.project-osrm.org https://photon.komoot.io https://tiles.openfreemap.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # El servidor no tiene por qué anunciar su versión.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los archivos de `assets/` llevan un hash en el nombre: si cambia el
    # contenido, cambia el nombre. Por eso se pueden cachear para siempre.
    #
    # `add_header` no se hereda: en cuanto un bloque declara uno, pierde todos
    # los de arriba. Por eso las de seguridad se repiten aquí dentro; si no,
    # los archivos de `assets/` se servirían sin ninguna.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # El index NO se cachea: es lo único que apunta a los archivos con hash, y
    # si el navegador se queda con uno viejo sigue pidiendo la versión anterior
    # aunque ya se haya desplegado otra.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Es una aplicación de una sola página: cualquier ruta que no sea un archivo
    # la resuelve el propio index. Sin esto, entrar directo a una URL interna o
    # recargar da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/ride-acceso.log;
    error_log  /var/log/nginx/ride-error.log;
}
