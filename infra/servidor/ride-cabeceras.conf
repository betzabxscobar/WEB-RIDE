# Cabeceras de seguridad de la web de Ride
# ---------------------------------------------------------------------------
# Las incluye `ride.nginx.conf` en el `server` y en CADA `location` que declare
# un `add_header` propio: nginx no hereda los `add_header` del nivel de arriba
# si el bloque tiene alguno, y asi se sirvio el index.html sin CSP ni
# X-Frame-Options. `npm run check:quality` comprueba que ningun bloque se lo
# salte y que coincidan con `public/_headers`.
#
# nginx las lee al recargar: tras cambiar este archivo, `sudo nginx -t` y
# `sudo systemctl reload nginx`.
#
# Sin `upgrade-insecure-requests`: mientras no haya certificado, entrar por
# http://IP hacia que el navegador pidiera los assets por https y la pagina
# saliera en blanco. Con HTTPS lo cubre HSTS, que es la herramienta para eso.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https://*.supabase.co https://router.project-osrm.org https://photon.komoot.io https://tiles.openfreemap.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

# Descomentar cuando certbot haya puesto el certificado. Sin `preload` al
# principio: si algo sale mal, se retira sin esperar a los navegadores.
# add_header Strict-Transport-Security "max-age=31536000" always;
