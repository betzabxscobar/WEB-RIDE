name: Calidad web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Revisar estilo y tipos
        run: npm run lint
      - name: Ejecutar pruebas
        run: npm test
      - name: Compilar versión de producción
        run: npm run build
      - name: Verificar seguridad y presupuestos de carga
        run: npm run check:quality
